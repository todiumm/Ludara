stages:
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BUILDOZER_WARN_ON_ROOT: "0"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  BUILDOZER_LOG_LEVEL: "2"

cache:
  key: "ludara-kivy-android-v1"
  paths:
    - .cache/pip/
    - .buildozer/
    - .android-sdk/

build_ludara_apk:
  stage: build
  image: ubuntu:24.04

  timeout: 3h

  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        python3 python3-pip python3-venv python3-dev
        git zip unzip curl wget
        openjdk-17-jdk
        build-essential ccache
        autoconf automake libtool pkg-config
        zlib1g-dev libncurses5-dev libncursesw5-dev
        libtinfo6 cmake libffi-dev libssl-dev
        automake autopoint gettext
    - python3 -m venv /opt/buildozer-venv
    - /opt/buildozer-venv/bin/pip install --upgrade pip setuptools wheel
    - /opt/buildozer-venv/bin/pip install buildozer cython

  script:
    - |
      set -eu

      echo "========================================"
      echo "       LUDARA ANDROID BUILDER"
      echo "========================================"

      if [ ! -f main.py ]; then
        echo "ERRO: main.py não encontrado na raiz."
        echo "Coloque o arquivo principal do Kivy na raiz do repositório."
        exit 1
      fi

      if [ ! -f buildozer.spec ]; then
        echo "ERRO: buildozer.spec não encontrado."
        echo "Crie e configure o arquivo antes de compilar."
        exit 1
      fi

      echo "Python:"
      python3 --version

      echo "Java:"
      java -version

      echo "Iniciando compilação Android..."

      /opt/buildozer-venv/bin/buildozer -v android debug

      mkdir -p output

      set -- bin/*.apk
      if [ ! -f "$1" ]; then
        echo "ERRO: nenhum APK foi gerado."
        exit 1
      fi

      cp bin/*.apk output/

      echo "APKs gerados:"
      ls -lh output/*.apk

  artifacts:
    name: "Ludara-Android-$CI_COMMIT_SHORT_SHA"
    paths:
      - output/*.apk
    expire_in: 30 days
    when: on_success

  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
